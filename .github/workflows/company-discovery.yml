name: Weekly company discovery

'on':
  schedule:
    - cron: '00 6 * * 1'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobscout-production
  cancel-in-progress: false

jobs:
  companies:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.JOBSCOUT_COMPANY_DISCOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[postgres]'
      - name: Discover and verify companies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBSCOUT_PROFILE_YAML: ${{ secrets.JOBSCOUT_PROFILE_YAML }}
          JOBSCOUT_DISCOVERY_YAML: ${{ secrets.JOBSCOUT_DISCOVERY_YAML }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          JOBSCOUT_MODE: companies
        run: python -m job_scout.cloud
