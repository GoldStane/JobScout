name: Tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pull the official image directly; ECR Public can exhaust its anonymous data quota.
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: jobscout_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: jobscout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobscout_test -d jobscout_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,postgres]'
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Tests including disposable PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://jobscout_test:local_test_only@localhost:5432/jobscout_test
        run: python -m pytest
