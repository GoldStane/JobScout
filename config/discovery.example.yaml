# Interests, skills, career tracks and locations use the existing --profile YAML.
# Arbeitnow is a bounded feed, not a keyword-search endpoint.
providers:
  arbeitnow:
    enabled: true
    max_pages: 3
    max_requests: 9  # Includes retries.
    attempts: 3
    interval_seconds: 1.0
    max_runtime_seconds: 120.0
    max_response_bytes: 5000000

  # Opt-in remote-only provider, cached daily; attribution stays in every digest.
  himalayas:
    enabled: false
    mode: browse  # Or search: rotates selected profile primary/secondary role queries daily.
    page_size: 20  # Browse only; search has a provider-defined page size.
    max_queries: 3  # Search only, without a role × location × seniority product.
    max_pages: 3  # Per query; max_requests remains shared across this provider.
    max_requests: 9
    attempts: 3
    interval_seconds: 1.0
    max_runtime_seconds: 120.0
    max_response_bytes: 5000000
    # Search-only filters (otherwise omitted):
    # country: Canada
    # worldwide_only: true  # Alternative to country, not a work-authorization guarantee.
    # sort: recent

  # Opt-in remote feed. One request per persisted refresh; no API key.
  remotive:
    enabled: false
    limit: 100
    refresh_hours: 24  # Minimum 6; shared across runners using the same database.
    max_pages: 1
    max_requests: 1
    attempts: 1  # Failures retain the cooldown rather than retrying immediately.
    max_runtime_seconds: 120.0
    max_response_bytes: 5000000

  # Optional metered web search. Requires BRAVE_SEARCH_API_KEY in the environment.
  # Never enabled by the presence of a key alone; dry-run skips metered search.
  brave:
    enabled: false
    # country: Canada  # Otherwise rotate the profile's preferred_regions.
    max_queries: 3  # Role/location queries, each restricted to supported ATS domains.
    max_pages: 1  # Per query; API offset ranges from 0 through 9.
    results_per_page: 10
    max_requests: 3  # Includes retries; shared across this run's queries/pages.
    daily_request_limit: 6  # Persistent UTC windows, shared by runners on this database.
    monthly_request_limit: 180
    attempts: 3
    interval_seconds: 1.1
    max_runtime_seconds: 180.0
    max_response_bytes: 5000000
    max_boards: 5
    publisher_max_requests: 15  # Separate bounded re-fetches; no search credential.
    publisher_runtime_seconds: 90.0
    # freshness: pm  # Optional INDEX freshness; never a posting-date claim.

# Opportunistically validate recognized ATS links already present in job data.
# No company-name crawling. Dry-run validates without registering anything.
registration:
  enabled: true
  max_new_boards_per_run: 20
  max_requests: 60  # Shared across all board validations, including retries.
  max_runtime_seconds: 120.0
  interval_seconds: 1.0
  max_response_bytes: 2000000
