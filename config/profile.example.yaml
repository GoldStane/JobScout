## PROFILE TEMPLATE — instructions and illustrative examples only.
## Nothing in this file is active configuration or a statement about any person.
## Copy it to your private config/profile.yaml, uncomment the YAML sections you
## need (remove the first '# '), and replace examples with your own choices.
## Keep explanatory lines beginning '##' commented. Do not overwrite an existing
## private profile without saving its contents. Never commit personal data or CVs.
## This comments-only template is intentionally NOT runnable before completion.
## Validate your completed profile: job-scout validate-config --profile config/profile.yaml
## Preview: job-scout monitor --profile config/profile.yaml --track systems --dry-run

## EDUCATION: optional facts, not requirements. Leave unknown values null.
## degree accepts high_school, associate, bachelors, masters or doctorate.
## field is free text. Set graduation date (YYYY-MM-DD) OR year, never both.
## currently_enrolled accepts true, false or null.
# education:
#   degree: null
#   field: null
#   expected_graduation_date: null
#   expected_graduation_year: null
#   currently_enrolled: null

## ELIGIBILITY: enter only known facts; unknown is not the same as false.
## work_authorized_countries can be a list of country names, or null if unknown.
## requires_sponsorship and willing_to_relocate accept true, false or null.
# eligibility:
#   work_authorized_countries: null
#   requires_sponsorship: null
#   willing_to_relocate: null

## PREFERENCES: configure the work you want, not an employer list.
## search_worldwide currently supports true only; filters below can narrow scope.
## preferred_regions affects ranking, not eligibility or strict exclusion.
## employment_types supports internship, graduate and entry_level (or [] for none).
## Role examples below illustrate syntax; replace them with your own interests.
## location_terms optionally maps a region label to explicit place-name aliases.
# preferences:
#   search_worldwide: true
#   preferred_regions: []
#   employment_types: []
#   primary_roles: [software engineer]
#   secondary_roles: []
#   location_terms: {}

## SKILLS: list your relevant skills; these are illustrative, not assumed facts.
# skills: [Python, SQL]

## RANKING: illustrative weights, normalized automatically.
## Each must be between 0 and 100; at least one must be positive.
# ranking_weights:
#   role_alignment: 0.35
#   skills_alignment: 0.25
#   education_experience_alignment: 0.20
#   compensation_career_potential: 0.10
#   location_preference: 0.10

## DIGEST: choose an IANA timezone, earliest local delivery time, score and limit.
## UTC/08:00 is an example, not a personal schedule. Scheduling must also be set up.
# digest:
#   timezone: UTC
#   send_after: "08:00"
#   minimum_score: 60
#   maximum_matches: 10

## FILTERS: strict inclusion/exclusion rules applied after scoring.
## Empty lists impose no restriction. allowed/excluded_locations are place names
## or labels from preferences.location_terms. Employment types use the same
## vocabulary as preferences; remote types are remote, hybrid and on_site.
## Unknown-value policies accept include or exclude; include preserves uncertainty.
# filters:
#   employment_types: []
#   allowed_locations: []
#   excluded_locations: []
#   remote_types: []
#   unknown_employment_type: include
#   unknown_location: include
#   unknown_remote_type: include

## SORT: first listed field has highest priority; missing values sort last.
## Fields: score, posted_at, first_seen_at, location, company, title.
## Direction: asc or desc. List each field at most once.
# sort:
#   - field: score
#     direction: desc
#   - field: posted_at
#     direction: desc

## FEEDBACK: optional label for an independent set of relevance decisions.
## Use the same value with 'job-scout feedback --scope ...'. Tracks share this scope.
# feedback_scope: default

## CAREER TRACKS: optional named overrides selected by --track NAME.
## 'systems' and 'general' below are arbitrary example labels, not built-in types.
## Rename them or add your own. Names are exact and case-sensitive.
## Example: --profile config/profile.yaml --track systems
## Without --track, the base roles/skills/weights above apply.
## A track REPLACES primary_roles and secondary_roles; omitted secondary_roles = [].
## Omitted skills or ranking_weights inherit base values. If supplying track weights,
## specify all five for clarity; omitted weight fields use model defaults.
## Education, eligibility, locations, filters and digest settings stay shared.
## Tracks share notification history; changing tracks does not resend delivered jobs.
## For discover-companies, explicit companies.engineering_domains in the discovery
## configuration take precedence over track roles/skills for company queries.
# career_tracks:
#   systems:
#     primary_roles: [systems software engineer, Linux engineer]
#     secondary_roles: [software engineer]
#     skills: [Linux, networking]
#   general:
#     primary_roles: [software engineer]
#     secondary_roles: []
## The general example inherits base skills and weights; systems replaces skills.
