[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scout"
version = "0.1.0"
description = "Personal job discovery and explainable matching service"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "SQLAlchemy>=2.0,<2.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
job-scout = "job_scout.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: integration tests against a disposable PostgreSQL schema"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
